name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: terrain-core
      - uses: actions/checkout@v7
        with:
          repository: pandaGaume/3d-tiles-core
          path: 3d-tiles-core
      - uses: actions/checkout@v7
        with:
          repository: pandaGaume/spacexr-tiling
          path: spacexr-tiling
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - name: Build spacexr-tiling
        working-directory: spacexr-tiling
        run: |
          npm ci
          npm run build
      - name: Build core
        working-directory: 3d-tiles-core/node
        run: |
          npm ci
          npm run build --workspace @spacexr/3d-tiles-core --workspace @spacexr/3d-tiles-runtime
      - name: Check terrain
        working-directory: terrain-core
        run: |
          npm ci
          npm run check
